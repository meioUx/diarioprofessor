production:
  secret_key_base: <%= ENV.fetch('SECRET_KEY_BASE').to_json %>
  REDIS_MODE: standalone
  REDIS_URL: <%= ENV.fetch('REDIS_URL', 'redis://localhost:6379').sub(%r{/\d+\z}, '').sub(%r{/\z}, '').to_json %>
  REDIS_DB_CACHE: '/0'
  REDIS_DB_SESSION: '/1'
  REDIS_DB_SIDEKIQ: '/2'
  sidekiq_password: <%= ENV.fetch('SIDEKIQ_PASSWORD', ENV.fetch('SECRET_KEY_BASE')).to_json %>
<% %w[SMTP_ADDRESS SMTP_PORT SMTP_DOMAIN SMTP_USER_NAME SMTP_PASSWORD NO_REPLY_ADDRESS
      EMAIL_SKIP_DOMAINS STUDENT_DOMAIN ASSET_HOST PASSPORT_CLIENT_ID PASSPORT_CLIENT_SECRET
      PASSPORT_URL PASSPORT_AUTHORIZE_URL PASSPORT_TOKEN_URL PASSPORT_USER_URL PASSPORT_SCOPE
      PASSPORT_LOGIN_BUTTON AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION AWS_BUCKET
      DOC_UPLOADER_AWS_BUCKET DOC_UPLOADER_AWS_REGION AUTH_TOKEN EXAM_POSTING_QUEUES].each do |key| %>
  <%= key %>: <%= ENV[key].to_json %>
<% end %>
